      tracePath(ctx, z.trong, z.rad);
      ctx.fillStyle = '#4A3A28';
      ctx.fill('evenodd');
      ctx.restore();
    }
  }

  /* Hai vuông màu tranh khác nhau nằm cạnh nhau thì mép giữa chúng là một đường
   * thẳng sắc lẹm — đủ để mắt đọc ra "hai miếng dán lại". Kéo một dải chuyển màu
   * vắt qua mép đó, mỗi bên nửa ô: hai bên cùng tiến tới 50% màu của nhau ở đúng
   * mép nên nối liền, trông như một lớp men đổi màu.
   *
   * PHA CHO CẢ BOARD, không phải riêng từng khối. Trước đây chỉ pha trong lòng
   * khối, nên cùng một ranh giới màu của bức tranh lại mềm ở đoạn này và gắt ở
   * đoạn kia — đúng chỗ nó cắt qua ranh khối. Cái gắt lên gắt xuống đó mới là
   * thứ đọc ra thành VẠCH, chứ không phải bản thân ranh khối.
   *
   * Ranh khối vẫn đọc được: rãnh vữa tối bên dưới không bị dải pha xoá đi.
   *
   * Cắt trong vùng ô ĐÃ LẮP nên không loang sang ô còn trống. */
  function blendPicture(ease){
    const G = window.G, cell = L.cell;
    const strength = 1 - (ease <= 0 ? 0 : ease);
    /* Loang bao nhiêu phần ô mỗi bên.
     *
     * Từng để 0,20. Nghe thì nhỏ, nhưng ô cao 50px là dải pha rộng 20px vắt qua
     * mép — mà hai bên cùng tiến tới 50% màu của nhau, nên bên SẪM có hẳn một
     * vệt sáng chạy dọc mép, bên SÁNG có một vệt tối. Mắt đọc vệt đó ra thành
     * một cái BẬC NỔI: một khối liền vắt qua hai vùng màu bỗng trông như hai
     * miếng chồng lên nhau. Đúng cái phải tránh — vùng màu của bức tranh phải
     * ra vùng màu, không được ra gờ nổi.
     *
     * 0,05 chỉ còn là một nét khử răng cưa (~2px), mép màu sắc gọn như trong
     * một bức tranh thật. Muốn mềm lại thì tăng con số này, chứ đừng đụng vào
     * chỗ khác. */
    const sp = cell*EDGE_SOFT*strength;
    if(sp < 0.5) return;

    /* Ô ĐƠN ĐỘC thì KHÔNG pha. Dải pha rộng 0,20 ô mỗi bên; ô nào bốn phía đều
     * khác màu sẽ bị ăn từ cả bốn hướng, lõi chỉ còn 60% và mép nhoè hết —
     * đúng cái làm hạt trân châu thành lỗ thủng và hạt cốm thành vệt bẩn.
     *
     * Mắt, mũi, hạt… vốn là chi tiết MỘT ô: nó phải sắc mới ra chi tiết. Còn
     * ranh giới giữa hai MẢNG màu (vùng nào cũng có ô cùng màu kề bên) vẫn pha
     * y như cũ — đó mới là chỗ dải pha sinh ra để làm mềm.
     *
     * So bằng `colorAt` (màu tranh gốc) chứ không bằng `faceCol`: faceCol có
     * lệch sắc theo từng ô lúc lên màu nên hai ô cùng vùng vẫn khác chuỗi. */
    const lone = new Uint8Array(G.fill.length);
    for(let i=0;i<G.fill.length;i++){
      const ci = G.colorAt[i];
      if(!ci) continue;
      const row = (i/G.cols)|0, c = i%G.cols;
      const same = (c > 0          && G.colorAt[i-1]       === ci)
                || (c+1 < G.cols   && G.colorAt[i+1]       === ci)
                || (row > 0        && G.colorAt[i-G.cols]  === ci)
                || (row+1 < G.rows && G.colorAt[i+G.cols]  === ci);
      if(!same) lone[i] = 1;
    }

    let any = false;
    ctx.save();
    ctx.beginPath();
    for(let i=0;i<G.fill.length;i++){
      if(G.fill[i] < 0 || !faceCol[i]) continue;
      const row = (i/G.cols)|0, c = i%G.cols;
      ctx.rect(L.bx+c*cell, L.by+row*cell, cell, cell);
      any = true;
    }
    if(!any){ ctx.restore(); return; }
    ctx.clip();

    for(let i=0;i<G.fill.length;i++){
      const ci = faceCol[i];
      if(G.fill[i] < 0 || !ci) continue;
      const row = (i/G.cols)|0, c = i%G.cols;
      const x = L.bx + c*cell, y = L.by + row*cell;

      if(c+1 < G.cols && faceCol[i+1] && faceCol[i+1] !== ci
         && !lone[i] && !lone[i+1]){
        const cr2 = faceCol[i+1];
        let gr = ctx.createLinearGradient(x+cell-sp, 0, x+cell, 0);
        gr.addColorStop(0, rgba(cr2, 0)); gr.addColorStop(1, rgba(cr2, 0.5));
        ctx.fillStyle = gr; ctx.fillRect(x+cell-sp, y, sp, cell);
        gr = ctx.createLinearGradient(x+cell+sp, 0, x+cell, 0);
        gr.addColorStop(0, rgba(ci, 0));  gr.addColorStop(1, rgba(ci, 0.5));
        ctx.fillStyle = gr; ctx.fillRect(x+cell, y, sp, cell);
      }
      if(row+1 < G.rows && faceCol[i+G.cols] && faceCol[i+G.cols] !== ci
         && !lone[i] && !lone[i+G.cols]){
        const cd = faceCol[i+G.cols];
        let gr = ctx.createLinearGradient(0, y+cell-sp, 0, y+cell);
        gr.addColorStop(0, rgba(cd, 0)); gr.addColorStop(1, rgba(cd, 0.5));
        ctx.fillStyle = gr; ctx.fillRect(x, y+cell-sp, cell, sp);
        gr = ctx.createLinearGradient(0, y+cell+sp, 0, y+cell);
        gr.addColorStop(0, rgba(ci, 0)); gr.addColorStop(1, rgba(ci, 0.5));
        ctx.fillStyle = gr; ctx.fillRect(x, y+cell, cell, sp);
      }
    }
    ctx.restore();
  }

  /* BỐN PHÍA của ô `i` có phải viên cùng khối `pid` không. */
  function sameBlock(i, pid){
    const G = window.G, row = (i/G.cols)|0, c = i%G.cols;
    const q = function(dr, dc){
      const r2 = row+dr, c2 = c+dc;
      return r2>=0 && r2<G.rows && c2>=0 && c2<G.cols && G.fill[r2*G.cols + c2] === pid;
    };
    return { L:q(0,-1), R:q(0,1), U:q(-1,0), D:q(1,0) };
  }

  /* BÓNG KHỐI lúc kéo — vệt LIỀN MỘT MẢNG đúng hình khối sắp rơi xuống, trùng
   * khít ô sẽ vào. Viên nào giáp viên cùng khối thì bỏ mạch vữa và bỏ bo góc ở
   * phía đó, nên đọc ra là MỘT khối chứ không phải mấy ô tối rời nhau.
   *
   * BÓNG MANG MÀU TRANH CỦA CHÍNH Ô NÓ ĐANG RÀ TỚI: rà sang chỗ khác thì bóng
   * đổi màu theo.
   *
   * Tô THEO NHÓM MÀU, mỗi nhóm một path một lần `fill`. Tô từng ô thì hai ô cùng
   * màu kề nhau chồng màu nửa trong ở mép chung, hằn ra sợi chỉ giữa thân khối.
   *
   * Vẽ ĐÈ LÊN cả ô đã có khối, không chỉ ô trống: đặt đè lên khiến khối cũ
   * bật về khay, nên bóng phải cho thấy TRỌN hình khối sắp chiếm chỗ. */
  /* Ba núm chỉnh ĐỘ LỘ của bóng. Càng lộ thì càng dễ xem trước cả bức
   * tranh chỉ bằng cách quét khối khắp board — mà luật gốc là chưa lắp xong thì
   * chưa được biết tranh. Để ở mức đủ đọc ra màu thuộc họ nào, chưa đủ để
   * chép lại bức tranh trong đầu.
   *   TOWARD  kéo màu về nâu tối bao nhiêu phần — cao thì màu nhạt đi
   *   ALPHA   độ đục của mảng màu
   *   VEIL    lớp nâu phủ cuối, buộc các mảng màu lại thành MỘT cái bóng
   * Muốn lộ hơn: hạ TOWARD, nâng ALPHA. Muốn kín hơn: làm ngược lại. */
  const GHOST_TOWARD = 0.50, GHOST_ALPHA = 0.52, GHOST_VEIL = 0.14;

  function drawGhost(idxs){
    const G = window.G, cell = L.cell;
    const set = new Set(idxs);
    const g = cell*GROUT, rad = cell*0.09;

    ctx.save();
    ctx.beginPath();
    for(let q=0;q<idxs.length;q++){
      const i = idxs[q], row = (i/G.cols)|0, c = i%G.cols;
      const has = function(dr, dc){
        const r2 = row+dr, c2 = c+dc;
        return r2>=0 && r2<G.rows && c2>=0 && c2<G.cols && set.has(r2*G.cols + c2);
      };
      const Lx=has(0,-1), Rx=has(0,1), Ux=has(-1,0), Dx=has(1,0);
      const x0 = L.bx + c*cell     + (Lx?0:g), x1 = L.bx + (c+1)*cell   - (Rx?0:g);
      const y0 = L.by + row*cell   + (Ux?0:g), y1 = L.by + (row+1)*cell - (Dx?0:g);
      rrSub(ctx, x0, y0, x1-x0, y1-y0,
        (Ux||Lx)?0:rad, (Ux||Rx)?0:rad, (Dx||Rx)?0:rad, (Dx||Lx)?0:rad);
    }
    ctx.clip();

    const groups = new Map();
    for(let q=0;q<idxs.length;q++){
      const key = G.colorAt[idxs[q]] || T.slot;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(idxs[q]);
    }
    ctx.globalAlpha = GHOST_ALPHA;
    groups.forEach(function(list, key){
      ctx.beginPath();
      for(let q=0;q<list.length;q++){
        const i = list[q], row = (i/G.cols)|0, c = i%G.cols;
        ctx.rect(L.bx + c*cell, L.by + row*cell, cell, cell);
      }
      ctx.fillStyle = mix(key, '#4A3A28', GHOST_TOWARD);
      ctx.fill();
    });

    /* Một lớp nâu rất mỏng phủ hết — buộc mấy mảng màu khác nhau lại thành một
     * cái bóng, thay vì trông như tranh đã hiện sẵn ở đó. */
    ctx.globalAlpha = GHOST_VEIL;
    ctx.fillStyle = '#4A3A28';
    ctx.fillRect(L.bx, L.by, G.cols*cell, G.rows*cell);
    ctx.restore();
  }

  /* TƯỜNG nằm TRÊN CẠNH giữa hai ô, không chiếm ô nào — đúng luật bản gốc.
   * Vẽ như một gờ vữa nổi: viền đất sẫm bọc ngoài, mặt sáng ở giữa. */
  function drawWalls(alpha){
    const G = window.G, cell = L.cell;
    const W = G.level.walls;
    if(!W || !W.count || alpha <= 0.02) return;
    /* Gờ mảnh, ôm sát đường lưới: dày 13% cạnh ô thì nó đè hẳn lên khe 2px và
     * đẩy hai ô hai bên ra xa nhau trông thấy. 6,5% vừa đủ đọc ra là có rào. */
    const t   = Math.max(1.6, cell*0.065);
    const pad = cell*0.04;
    ctx.save();
    ctx.globalAlpha = alpha;
    for(let i=0;i<W.R.length;i++){
      const r = (i/G.cols)|0, c = i%G.cols;
      if(W.R[i]) ridge(L.bx+(c+1)*cell - t/2, L.by+r*cell + pad, t, cell - pad*2);
      if(W.D[i]) ridge(L.bx+c*cell + pad, L.by+(r+1)*cell - t/2, cell - pad*2, t);
    }
    ctx.restore();
  }
  function ridge(x, y, w, h){
    const r = Math.min(w,h)/2;
    rr(ctx, x-0.7, y-0.7, w+1.4, h+1.4, r+0.7);
    ctx.fillStyle = '#9C7B4E'; ctx.fill();
    rr(ctx, x, y, w, h, r);
    ctx.fillStyle = '#C9A87C'; ctx.fill();
  }

  /* ------------------------------------------------- khối đang kéo (overlay) */
  /* Khối ĐANG TRÊN TAY luôn là màu đất — MÀU TRANH CHỈ HIỆN KHI ĐÃ ĐẶT XUỐNG.
   * Màu đất `#D8C2A4` trên nền linen `#EFE3D0` là beige trên beige, nên khối
   * trên tay được viền mực bao quanh để vẫn đọc ra được (xem cuối hàm). */
  /* Bốn phía của một ô trong shape — dùng chung cho khối trên tay và ô khay. */
  function shapeNb(sh, q){
    if(!sh._nb){
      const set = new Set();
      for(let t=0;t<sh.cells.length;t++) set.add(sh.cells[t][0]+':'+sh.cells[t][1]);
      sh._nb = sh.cells.map(function(p){
        return { U:set.has((p[0]-1)+':'+p[1]), D:set.has((p[0]+1)+':'+p[1]),
                 L:set.has(p[0]+':'+(p[1]-1)), R:set.has(p[0]+':'+(p[1]+1)) };
      });
    }
    return sh._nb[q];
  }


  /* Đường bao liền của một SHAPE (khay / khối trên tay), dùng chung bộ đi vòng
   * với khối đã đặt trên board — nên ba chỗ ra đúng một hình. */
  function shapeOutline(sh, ox, oy, cell, inset){
    if(!sh._idx) sh._idx = sh.cells.map(function(p){ return p[0]*sh.w + p[1]; });
    return outline(sh._idx, sh.w, sh.h, cell, ox, oy, inset);
  }

  /* KHỐI ĐANG CẦM TRÊN TAY — cũng phải là MỘT miếng liền, giống ô khay nó vừa
   * rời ra và giống mảng nó sẽ thành khi đặt xuống. Ba cái đó trùng hình nhau
   * thì người chơi mới nối được: cái này lấy từ đâu, gỡ ra thì mất gì. */
  /* Tâm hình vẽ trong Ô KHAY của một khối, theo TOẠ ĐỘ MÀN HÌNH — khối đang
   * bay được vẽ trên #dragLayer mà lớp đó phủ cả viewport. Trả kèm tỉ lệ thu
   * nhỏ, để bay tới nơi thì khối vừa đúng cỡ hình trong ô khay chứ không phải
   * đột ngột đổi cỡ ở khung cuối.
   *
   * Nhắm vào `.chip-art` chứ không phải cả cái chip: chip còn một dòng "×N" ở
   * dưới nên tâm chip nằm thấp hơn tâm hình vẽ. */
  function chipPoint(shapeId){
    const G = window.G;
    let idx = -1;
    for(let k=0;k<G.deck.length;k++)
      if(G.deck[k].shapeId === shapeId){ idx = k; break; }
    const chip = idx >= 0 ? deckEl.children[idx] : null;
    const el = (chip && chip.querySelector('.chip-art')) || chip || deckEl;
    if(!el) return null;
    const b = el.getBoundingClientRect();
    if(!b.width && !b.height) return null;           // khay đang ẩn
    const sh = window.SHAPES[shapeId];
    const px = chipPx(sh);
    return { x: b.left + b.width/2, y: b.top + b.height/2,
             scale: L.cell > 0 ? px/L.cell : 0.4 };
  }

  /* MỘT KHỐI ĐANG BAY giữa khay và board. Toạ độ màn hình, cỡ ô tuỳ ý, tâm
   * khối đặt đúng vào (cx, cy) — nên thu nhỏ là thu quanh chính nó chứ không
   * trượt về góc board.
   *
   * `earth` 0→1 kéo màu tranh về màu đất `T.block` của khay: khối rời board thì
   * nhạt dần thành đúng món hàng trên khay, bay lên thì lên màu tranh. Không có
   * đoạn chuyển đó thì hai đầu đường bay là hai khối khác nhau. */
  function drawFlyer(c, idxs, pid, cell, cx, cy, earth, alpha){
    const G = window.G;
    let minR=Infinity, maxR=-Infinity, minC=Infinity, maxC=-Infinity;
    for(let q=0;q<idxs.length;q++){
      const r=(idxs[q]/G.cols)|0, cc=idxs[q]%G.cols;
      if(r<minR) minR=r;   if(r>maxR) maxR=r;
      if(cc<minC) minC=cc; if(cc>maxC) maxC=cc;
    }
    const bx = cx - (minC+maxC+1)/2*cell, by = cy - (minR+maxR+1)/2*cell;
    const g = cell*GROUT, rad = cell*0.09;
    const pts  = outline(idxs, G.cols, G.rows, cell, bx, by, g);
    const mort = outline(idxs, G.cols, G.rows, cell, bx, by, 0);
    const bb = [bx + minC*cell, by + minR*cell,
                bx + (maxC+1)*cell, by + (maxR+1)*cell];

    const paint = function(darken){
      const groups = new Map();
      for(let q=0;q<idxs.length;q++){
        const i = idxs[q];
        const full = shade(G.colorAt[i], jitter(pid*1013));
        const col  = earth > 0 ? mix(full, T.block, earth) : full;
        if(!groups.has(col)) groups.set(col, []);
        groups.get(col).push(i);
      }
      groups.forEach(function(list, col){
        c.beginPath();
        for(let q=0;q<list.length;q++){
          const i=list[q], r=(i/G.cols)|0, cc=i%G.cols;
          c.rect(bx+cc*cell-0.5, by+r*cell-0.5, cell+1, cell+1);
        }
        c.fillStyle = darken ? shade(col, darken) : col;
        c.fill();
      });
    };
    const path = function(p, r){
      c.beginPath();
      if(p) tracePath(c, p, r);
      else for(let q=0;q<idxs.length;q++){
        const i=idxs[q], row=(i/G.cols)|0, cc=i%G.cols;
        c.rect(bx+cc*cell, by+row*cell, cell, cell);
      }
    };

    c.save();
    c.globalAlpha = alpha;

    /* Bóng đổ: khối đang bay thì nó ở TRÊN mặt tranh, phải có bóng mới đọc ra
     * là bay. Tô mặt khối một lượt để canvas hắt bóng, mặt thật vẽ đè lên sau. */
    c.save();
    c.shadowColor = 'rgba(91,75,52,.34)';
    c.shadowBlur = Math.max(6, cell*0.42); c.shadowOffsetY = Math.max(3, cell*0.18);
    path(pts, rad);
    c.fillStyle = T.block; c.fill();
    c.restore();

    c.save(); path(mort, cell*0.05); c.clip(); paint(-0.085); c.restore();

    c.save(); path(pts, rad); c.clip();
    paint(0);
    const gr = c.createLinearGradient(0, bb[1], 0, bb[3]);
    gr.addColorStop(0,   'rgba(255,255,255,.20)');
    gr.addColorStop(0.5, 'rgba(255,255,255,0)');
    gr.addColorStop(1,   'rgba(0,0,0,.10)');
    c.fillStyle = gr; c.fillRect(bb[0], bb[1], bb[2]-bb[0], bb[3]-bb[1]);
    c.restore();

    if(pts){
      const w = Math.max(1, cell*0.032);
      const inner = outline(idxs, G.cols, G.rows, cell, bx, by, g+w);
      if(inner){
        c.beginPath(); tracePath(c, pts, rad); tracePath(c, inner, Math.max(0, rad-w));
        const gr2 = c.createLinearGradient(0, bb[1], 0, bb[3]);
        gr2.addColorStop(0,    'rgba(255,255,255,.17)');
        gr2.addColorStop(0.55, 'rgba(255,255,255,0)');
        gr2.addColorStop(1,    'rgba(74,58,40,.11)');
        c.fillStyle = gr2; c.fill('evenodd');
      }
    }
    c.restore();
  }

  /* Đường bay: một VÒNG CUNG chứ không phải đường thẳng. Khay nằm ngay dưới
   * board nên đường thẳng gần như thẳng đứng, nhìn ra "biến mất rồi hiện lại"
   * chứ không ra "đi từ đây tới kia". */
  function drawFlyers(){
    const FX = window.FX;
    if(!FX) return;
    const list = FX.flyers();
    if(!list.length) return;
    const G = window.G, cell = L.cell;
    if(!cell) return;
    const b = cv.getBoundingClientRect(), nowT = FX.now();

    for(let k=0;k<list.length;k++){
      const f = list[k];
      const t = Math.max(0, Math.min(1, (nowT - f.t0)/f.ms));

      let minR=Infinity, maxR=-Infinity, minC=Infinity, maxC=-Infinity;
      for(let q=0;q<f.idxs.length;q++){
        const r=(f.idxs[q]/G.cols)|0, cc=f.idxs[q]%G.cols;
        if(r<minR) minR=r;   if(r>maxR) maxR=r;
        if(cc<minC) minC=cc; if(cc>maxC) maxC=cc;
      }
      /* Đầu BOARD của đường bay — suy lại mỗi khung hình nên đổi khổ màn hình
       * giữa chừng cũng không lệch. */
      const hx = f.hand ? f.hand.x : b.left + L.bx + (minC+maxC+1)/2*cell;
      const hy = f.hand ? f.hand.y : b.top  + L.by + (minR+maxR+1)/2*cell;

      /* `away` 1 = đang ở khay, 0 = đang ở board. Bay lên thì chậm dần (đáp
       * nhẹ), bay về khay thì nhanh dần (bị hất đi). */
      const away = f.dir === 'in' ? Math.pow(1-t, 3) : t*t*t;
      const x = hx + (f.pt.x - hx)*away;
      const y = hy + (f.pt.y - hy)*away - Math.sin(Math.PI*away)*cell*0.62;
      const s = cell*(1 - (1 - f.pt.scale)*away);
      const a = f.dir === 'in' ? Math.min(1, t*5)
                               : Math.max(0, Math.min(1, 1 - (t-0.74)/0.26));
      drawFlyer(dctx, f.idxs, f.pid, s, x, y, away, a);
    }
  }

  function drawDrag(){
    const G = window.G;
    const wh = fit(dg, dctx);
    dctx.clearRect(0,0,wh[0],wh[1]);
    drawFlyers();
    if(!G.drag) return;
    const d = G.drag, sh = window.SHAPES[d.shapeId], cell = L.cell;
    const b  = cv.getBoundingClientRect();
    const ox = b.left + d.left, oy = b.top + d.top;
    const g  = cell*GROUT, rad = cell*0.09;
    const lw = Math.max(1.2, cell*0.055);

    const pts = shapeOutline(sh, ox, oy, cell, g);
    const path = function(p, r){
      dctx.beginPath();
      if(p) tracePath(dctx, p, r);
      else for(let q=0;q<sh.cells.length;q++)       // phòng hờ
        meshRect(dctx, ox + sh.cells[q][1]*cell, oy + sh.cells[q][0]*cell,
                 cell, shapeNb(sh, q), GROUT, 0, 0.6, rad);
    };

    /* mặt khối + bóng đổ */
    dctx.save();
    dctx.shadowColor = 'rgba(91,75,52,.38)';
    dctx.shadowBlur = 14; dctx.shadowOffsetY = 7;
    path(pts, rad);
    dctx.fillStyle = T.block; dctx.fill();
    dctx.restore();

    /* vệt vát chạy suốt cả khối, không phải mỗi ô một vệt */
    dctx.save();
    path(pts, rad); dctx.clip();
    const gr = dctx.createLinearGradient(0, oy, 0, oy + sh.h*cell);
    gr.addColorStop(0,   'rgba(255,255,255,.20)');
    gr.addColorStop(0.5, 'rgba(255,255,255,0)');
    gr.addColorStop(1,   'rgba(0,0,0,.10)');
    dctx.fillStyle = gr; dctx.fillRect(ox, oy, sh.w*cell, sh.h*cell);
    dctx.restore();

    /* Viền mực quanh khối: chưa tới board thì chưa có ô nào để lấy màu, mà màu
     * đất trên nền linen là beige trên beige.
     *
     * Lấy HAI đường bao rồi tô theo luật chẵn‑lẻ, KHÔNG dùng stroke(): stroke
     * tô viền của TẤT CẢ ô con trong path nên nét sẽ chạy cả vào mạch giữa hai
     * viên cùng khối — đúng cái vừa nhập liền xong. */
    const inner = shapeOutline(sh, ox, oy, cell, g + lw);
    if(pts && inner){
      dctx.beginPath();
      tracePath(dctx, pts,   rad);
      tracePath(dctx, inner, Math.max(0, rad - lw));
      dctx.fillStyle = 'rgba(91,75,52,.42)';
      dctx.fill('evenodd');
    }
  }

  /* Chuỗi path SVG của một đa giác đã bo góc. SVG không có arcTo nên dùng
   * đường bậc hai với chính cái đỉnh làm điểm điều khiển — với góc vuông thì
   * nhìn không khác cung tròn. */
  function traceD(pts, rad){
    const n = pts.length, f = function(v){ return v.toFixed(2); };
    const lerp = function(a, b, t){
      return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
    };
    let d = '';
    for(let t=0;t<n;t++){
      const prev = pts[(t-1+n)%n], cur = pts[t], nxt = pts[(t+1)%n];
      const lenA = Math.hypot(cur[0]-prev[0], cur[1]-prev[1]);
      const lenB = Math.hypot(nxt[0]-cur[0], nxt[1]-cur[1]);
      const r = Math.max(0, Math.min(rad, lenA/2, lenB/2));
      const a = lerp(cur, prev, lenA ? r/lenA : 0);
      const b = lerp(cur, nxt,  lenB ? r/lenB : 0);
      d += (t === 0 ? 'M' + f(a[0]) + ',' + f(a[1]) : 'L' + f(a[0]) + ',' + f(a[1]));
      d += 'Q' + f(cur[0]) + ',' + f(cur[1]) + ' ' + f(b[0]) + ',' + f(b[1]);
    }
    return d + 'Z';
  }

  /* Ô KHAY — vẽ shape thành MỘT miếng liền, cùng đường bao với khối trên tay.
   * Trước đây mỗi ô một hình vuông rời, nên khối năm ô nhìn y như năm khối một
   * ô đứng cạnh nhau — đặt xuống rồi thì không biết gỡ ra sẽ mất những ô nào. */
  function shapeSVG(sh, px, color){
    const w = sh.w*px, h = sh.h*px, g = px*0.045, r = px*0.09;
    const pts = shapeOutline(sh, 0, 0, px, g);
    let body;
    if(pts){
      body = '<path d="' + traceD(pts, r) + '" fill="' + color + '"/>';
    } else {                                     // phòng hờ: quay về ghép ô
      body = '';
      for(let q=0;q<sh.cells.length;q++){
        const x = sh.cells[q][1]*px + g, y = sh.cells[q][0]*px + g, S = px - 2*g;
        body += '<rect x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+S.toFixed(2)
              + '" height="'+S.toFixed(2)+'" rx="'+r.toFixed(2)+'" fill="'+color+'"/>';
      }
    }
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h
         + '" aria-hidden="true">' + body + '</svg>';
  }


  /* Cỡ ô vẽ trong một ô khay. Đo THEO TỪNG CHIỀU chứ không theo cạnh dài
   * nhất: lấy max(w,h) thì khối 4×4 hay 6×2 đều bị cắt cụt — mà thang dạy
   * toàn khối cỡ đó.
   * CHIP_ART phải khớp `.chip-art` trong index.html (cao 54) và bề rộng còn
   * lại trong ô khay 80px. Đổi CSS thì đổi luôn hai số này. */
  const CHIP_ART = { w:72, h:54 };
  function chipPx(sh){
    return Math.max(7, Math.min(19,
      Math.floor(Math.min(CHIP_ART.h/sh.h, CHIP_ART.w/sh.w))));
  }

  function buildDeck(){
    const G = window.G;
    let html = '';
    for(let i=0;i<G.deck.length;i++){
      const sh = window.SHAPES[G.deck[i].shapeId];
      const px = chipPx(sh);
      html += '<button class="chip" data-i="'+i+'" type="button" aria-label="'+sh.name+'">'
            +   '<span class="chip-art">' + shapeSVG(sh, px, T.block) + '</span>'
            +   '<span class="chip-n">×<b>'+G.deck[i].total+'</b></span>'
            + '</button>';
    }
    deckEl.innerHTML = html;
    deckEl.scrollLeft = 0;
    syncDeck();
    deckEdges();
  }

  function syncDeck(){
    const G = window.G;
    const kids = deckEl.children;
    for(let i=0;i<kids.length && i<G.deck.length;i++){
      const d = G.deck[i];
      kids[i].querySelector('.chip-n b').textContent = d.left;
      kids[i].classList.toggle('empty', d.left <= 0);
      kids[i].classList.toggle('hint', G.hintChip === i);
      kids[i].classList.toggle('sel', G.sel === i);
    }
    deckEdges();
  }

  /* Khay có tràn ra ngoài khung không, và đang ở đầu hay cuối? Bật/tắt vệt mờ
   * hai mép để người chơi BIẾT là còn ô nữa ở phía sau — thanh cuộn bị giấu
   * (`scrollbar-width:none`) nên không có vệt thì không có dấu hiệu nào cả. */
  function deckEdges(){
    if(!deckEl) return;
    const max = deckEl.scrollWidth - deckEl.clientWidth;
    const x   = deckEl.scrollLeft;
    deckEl.classList.toggle('more-l', max > 4 && x > 2);
    deckEl.classList.toggle('more-r', max > 4 && x < max - 2);
  }

  function deckScrollable(){
    return !!deckEl && (deckEl.scrollWidth - deckEl.clientWidth) > 4;
  }

  function scrollChipIntoView(i){
    const el = deckEl.children[i];
    if(el && el.scrollIntoView) el.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
  }

  window.R = { bind:bind, layout:layout, fitBoard:fitBoard, draw:draw, drawDrag:drawDrag,
               boardIndexAt:boardIndexAt, buildDeck:buildDeck, syncDeck:syncDeck,
               scrollChipIntoView:scrollChipIntoView, shapeSVG:shapeSVG,
               chipPoint:chipPoint, deckEdges:deckEdges, deckScrollable:deckScrollable,
               setView:setView, viewBusy:viewBusy, zoomed:zoomed,
               mix:mix, shade:shade, rgba:rgba };
})();

</script>
<script>
/* ==== src/fx.js ==== */
/* ============================================================================
 * fx.js — Chuyển động của khối lúc ĐẶT XUỐNG board và lúc TRẢ VỀ KHAY.
 * ----------------------------------------------------------------------------
 * Ở đây CHỈ có trạng thái và thời gian. Việc vẽ nằm hết bên `render.js` — nó
 * đã giữ toàn bộ bộ vẽ gốm (đường bao, mạch vữa, vệt vát, viền sáng); tách ra
 * vẽ riêng là phải chép lần hai, rồi hai bản lệch nhau lúc nào không hay.
 *
 * BA CÚ, không hơn:
 *
 *   land    Khối vừa nằm xuống. KHÔNG rơi từ trên xuống — lúc kéo thả, khối đã
 *           nằm sẵn dưới ngón tay đúng ô đó rồi; cho nó rơi thêm một quãng là
 *           kể sai chuyện. Cái người chơi vừa làm là ẤN XUỐNG.
 *
 *   flyIn   Chạm chip rồi chạm board: khối BAY TỪ Ô KHAY LÊN, tới nơi mới
 *           `land`. Chỉ đường đặt này mới có, vì chỉ ở đây khối mới thật sự đi
 *           từ khay lên board. Kéo thả thì không — nó đã ở trên tay.
 *
 *   flyOut  Khối rời board về khay: chạm để gỡ (luật 8), bị đè đẩy ra (luật 6),
 *           kéo ra ngoài tranh, hoàn tác. Một cú duy nhất cho cả bốn đường.
 *
 * `flyIn`/`flyOut` GIỐNG NHAU ở cả bốn kiểu — đó là phần đã duyệt. Cái khác
 * nhau giữa bốn kiểu chỉ là `land`: khối đáp xuống ra sao.
 *
 * Khối đang bay vẽ trên `#dragLayer` (fixed, phủ cả viewport) chứ không phải
 * canvas board: canvas board dừng đúng ở mép tranh, bay tới khay là bị cắt cụt.
 *
 * Không giữ toạ độ pixel nào ở đây. Ô khay là DOM và co giãn theo khổ màn hình
 * nên vị trí phải hỏi `R.chipPoint()` lúc bắt đầu bay; vị trí trên board thì
 * render tự suy từ `idxs` mỗi khung hình — xoay ngang điện thoại giữa chừng
 * cũng không lệch.
 * ==========================================================================*/
(function(){

  /* -------------------------------------------------------------- BỐN KIỂU
   * `kind` quyết định cách khối đáp:
   *   spring — nén một chiều / phình chiều kia rồi dao động tắt dần.
   *            `ax`/`ay` là biên độ ngang/dọc; lệch nhau vì mắt bắt chiều dọc
   *            nhạy hơn, bằng nhau thì đọc ra "phóng to" chứ không ra "nện".
   *   press  — hiện ra to hơn rồi lún về đúng cỡ ô. Không quá đà, không nảy.
   *
   * `dust` 0 = không bụi. `ripple` 1 = các khối xung quanh lún theo thành sóng. */
  const PRESETS = [
    { id:'A', name:'Nén & bật',
      desc:'Khối nén dọc 15% / phình ngang 11% rồi bật lại, dao động tắt dần trong 260 ms, kèm bụi vữa ở chân.',
      land:260, kind:'spring', ax:0.11, ay:0.15, damp:4.2, freq:7.6, dust:1, ripple:0 },

    { id:'B', name:'Ấn vào vữa',
      desc:'Khối hiện ra to hơn 6% rồi lún về đúng cỡ ô trong 170 ms. Không quá đà, không nảy, không bụi.',
      land:170, kind:'press', from:1.06, dust:0, ripple:0 },

    { id:'C', name:'Nảy gốm',
      desc:'Như kiểu A nhưng mạnh tay: nén 23%, dao động lâu hơn, bụi bắn nhiều hơn. 320 ms.',
      land:320, kind:'spring', ax:0.17, ay:0.23, damp:3.5, freq:8.6, dust:1.7, ripple:0 },

    { id:'D', name:'Board rung theo',
      desc:'Khối đáp gọn trong 150 ms, rồi CÁC KHỐI XUNG QUANH lún theo thành sóng lan ra — khối càng xa vào càng chậm.',
      land:150, kind:'spring', ax:0.07, ay:0.10, damp:5.2, freq:8.2, dust:0, ripple:1 }
  ];

  /* Sóng của kiểu D. Đo TÂM tới TÂM chứ không phải mép tới mép: cả khối lún
   * xuống như MỘT đơn vị nên thứ quyết định lúc nó lún là tâm nó ở đâu. Đo từ
   * mép thì gần hết mọi khối đều "cách 1 ô" và sóng sụp thành một nhịp. */
  const RIPPLE = { stag:46, ms:150, depth:0.05, reach:6 };

  const MS = { flyIn:280, flyOut:320, dust:300 };

  /* KIỂU ĐANG DÙNG — 'A', đã duyệt. Ba kiểu kia giữ lại cho bản duyệt
   * `demo/anim-presets.html`; đổi mặc định là sửa đúng dòng dưới đây. */
  const DEFAULT = 'A';
  let P = PRESETS.filter(function(p){ return p.id === DEFAULT; })[0] || PRESETS[0];

  /* pid → mốc bắt đầu `land`. Mốc CÓ THỂ NẰM Ở TƯƠNG LAI: khối đang bay từ
   * khay lên thì đã có mặt trong `G.placements` nhưng chưa được vẽ ở board;
   * `xformOf` trả `hidden` cho tới đúng lúc nó đáp. */
  const lands  = new Map();
  const dips   = new Map();   // pid → { t0 } — khối lún theo sóng của kiểu D
  const flyers = [];          // { pid, shapeId, idxs, t0, ms, dir, pt, hand }
  const dusts  = [];          // { pid, t0, p }

  let T = 0;

  function tick(t){
    T = t;
    for(let k=flyers.length-1;k>=0;k--)
      if(t - flyers[k].t0 >= flyers[k].ms) flyers.splice(k,1);
    for(let k=dusts.length-1;k>=0;k--)
      if(t - dusts[k].t0 >= MS.dust) dusts.splice(k,1);
    lands.forEach(function(t0, pid){ if(t - t0 >= P.land) lands.delete(pid); });
    dips.forEach(function(d, pid){ if(t - d.t0 >= RIPPLE.ms) dips.delete(pid); });
  }

  /* Tâm khối theo Ô LƯỚI (không phải pixel) — chỉ dùng để xếp thứ tự sóng. */
  function centerOf(idxs, cols){
    let sr = 0, sc = 0;
    for(let k=0;k<idxs.length;k++){ sr += (idxs[k]/cols)|0; sc += idxs[k]%cols; }
    return [sr/idxs.length, sc/idxs.length];
  }

  function ripple(pid, at){
    const G = window.G;
    if(!G || !G.placements) return;
    const me = G.placements.get(pid);
    if(!me) return;
    const c0 = centerOf(me.idxs, G.cols);
    G.placements.forEach(function(pl){
      if(pl.id === pid) return;
      const c = centerOf(pl.idxs, G.cols);
      const d = Math.hypot(c[0]-c0[0], c[1]-c0[1]);
      if(d > RIPPLE.reach) return;
      dips.set(pl.id, { t0: at + 40 + Math.max(0, d-1)*RIPPLE.stag });
    });
  }

  function land(pid, at){
    const t0 = (at == null) ? T : at;
    lands.set(pid, t0);
    if(P.dust) dusts.push({ pid:pid, t0:t0, p:P.dust });
    if(P.ripple) ripple(pid, t0);
  }

  function flyIn(pid, shapeId, idxs, pt){
    if(!pt){ land(pid); return; }            // không tìm thấy ô khay: đáp luôn
    flyers.push({ pid:pid, shapeId:shapeId, idxs:idxs.slice(), t0:T,
                  ms:MS.flyIn, dir:'in', pt:pt, hand:null });
    land(pid, T + MS.flyIn);                 // đáp NGAY khi bay tới, không hở khung
  }

  /* `hand` là chỗ bắt đầu bay, theo toạ độ màn hình — dùng cho cú kéo khối ra
   * ngoài tranh: lúc đó khối đang ở đầu ngón tay chứ không còn ở chỗ cũ trên
   * board nữa, bay từ chỗ cũ ra là bay từ một nơi không có gì. */
  function flyOut(pid, shapeId, idxs, pt, hand){
    lands.delete(pid); dips.delete(pid);
    if(!pt) return;
    flyers.push({ pid:pid, shapeId:shapeId, idxs:idxs.slice(), t0:T,
                  ms:MS.flyOut, dir:'out', pt:pt, hand:hand || null });
  }

  /* Khối này đang co giãn thế nào? null = đứng yên, vẽ như thường. */
  function xformOf(pid){
    const t0 = lands.get(pid);
    if(t0 != null){
      if(T < t0) return { hidden:true };
      const u = (T - t0)/P.land;
      if(u < 1){
        if(P.kind === 'press'){
          const e = 1 - Math.pow(1-u, 3);
          const s = P.from - (P.from-1)*e;
          return { sx:s, sy:s };
        }
        const q = Math.exp(-P.damp*u)*Math.cos(P.freq*u);   // tắt dần, q(0)=1
        return { sx: 1 + P.ax*q, sy: 1 - P.ay*q };
      }
    }
    const d = dips.get(pid);
    if(d){
      const u = (T - d.t0)/RIPPLE.ms;
      if(u <= 0 || u >= 1) return null;
      const s = 1 - RIPPLE.depth*Math.sin(Math.PI*u);
      return { sx:s, sy:s };
    }
    return null;
  }

  function use(id){
    for(let k=0;k<PRESETS.length;k++) if(PRESETS[k].id === id){
      P = PRESETS[k]; clear(); return P;
    }
    return P;
  }
  function clear(){ lands.clear(); dips.clear(); flyers.length = 0; dusts.length = 0; }
  function active(){
    return flyers.length > 0 || dusts.length > 0 || lands.size > 0 || dips.size > 0;
  }

  window.FX = {
    MS:MS, tick:tick, now:function(){ return T; },
    land:land, flyIn:flyIn, flyOut:flyOut,
    xformOf:xformOf, clear:clear, active:active,
    use:use, presets:function(){ return PRESETS; }, current:function(){ return P; },
    flyers:function(){ return flyers; },
    dusts:function(){ return dusts; }
  };

})();

</script>
<script>
/* ==== src/confetti.js ==== */
/* ============================================================================
 * confetti.js — Pháo giấy ăn mừng lúc xong màn.
 * ----------------------------------------------------------------------------
 * HAI KHẨU Ở HAI GÓC DƯỚI, bắn chéo lên vào giữa màn hình. Bắn từ góc chứ
 * không phải từ trên rơi xuống: pháo rơi từ trên là hiệu ứng của thứ ĐÃ xong
 * từ trước, còn bắn lên từ dưới đọc ra là "vừa mới xong ngay lúc này".
 *
 * Vẽ nhờ trên `#dragLayer` — lớp canvas phủ cả viewport, `pointer-events:none`,
 * z-index 20, mỗi khung hình `R.drawDrag()` đã xoá sạch và đặt sẵn phép biến
 * đổi theo DPR. Ta vẽ NGAY SAU nó nên toạ độ ở đây là pixel CSS thuần, và
 * không phải dựng thêm canvas nào.
 *
 * Không đụng gì tới `fx.js` (hiệu ứng khối đáp xuống) — hai hệ độc lập.
 * ==========================================================================*/
(function(){

  /* Lấy từ bảng màu của mấy bức tranh trong `pictures.js` cho cùng tông ấm,
   * thêm màu giấy để có mảnh sáng bật lên trên nền linen. */
  const COLORS = ['#E8574B', '#F2A65A', '#FBD24B', '#3FAF9B',
                  '#4FA3C4', '#F27CA4', '#B07A4E', '#FFFDF8'];

  const GRAV = 1650;      // px/s² — rơi hơi nhanh, đỡ lê thê
  const DRAG = 0.62;      // hệ số cản/s, để mảnh giấy đuối dần chứ không bay thẳng
  const FADE = 0.55;      // giây cuối đời dùng để mờ đi

  let cv = null, ctx = null, parts = [], last = 0;

  /* Người dùng khai báo hạn chế chuyển động thì im lặng bỏ qua — pháo giấy là
   * trang trí thuần, không mang thông tin nào cả. */
  const reduced = (typeof matchMedia === 'function') &&
                  matchMedia('(prefers-reduced-motion: reduce)').matches;

  function bind(){
    if(ctx) return true;
    cv = document.getElementById('dragLayer');
    if(!cv) return false;
    ctx = cv.getContext('2d');
    return true;
  }

  function rnd(a, b){ return a + Math.random()*(b-a); }

  /* Một khẩu. `dirX` = +1 bắn sang phải (khẩu trái), -1 bắn sang trái. */
  function cannon(x, y, dirX, n){
    for(let i=0;i<n;i++){
      /* Ngẩng 54°–83° so với phương ngang: thấp hơn thì giấy tạt ngang ra khỏi
       * màn hình trước khi kịp thấy, cao hơn thì hai chùm chụm vào giữa thành
       * một cột. */
      const ang = rnd(Math.PI*0.30, Math.PI*0.46);
      const sp  = rnd(880, 1580);
      parts.push({
        x:x, y:y,
        vx: Math.cos(ang)*sp*dirX,
        vy: -Math.sin(ang)*sp,
        w: rnd(6, 11), h: rnd(9, 16),
        rot: rnd(0, Math.PI*2), vr: rnd(-9, 9),
        ph: rnd(0, Math.PI*2), fr: rnd(6, 11),   // pha + tần số lật
        col: COLORS[(Math.random()*COLORS.length)|0],
        life: 0, max: rnd(1.7, 2.7)
      });
    }
  }

  /* Một loạt: hai khẩu hai góc dưới. Gọi lại được nhiều lần, các loạt chồng
   * lên nhau. */
  function burst(){
    if(reduced || !bind()) return;
    const w = cv.clientWidth, h = cv.clientHeight;
    if(!w || !h) return;
    const n = w < 480 ? 42 : 60;             // màn hẹp thì bớt mảnh cho nhẹ
    cannon(w*0.035, h*0.99,  1, n);
    cannon(w*0.965, h*0.99, -1, n);
  }

  function clear(){ parts.length = 0; }
  function active(){ return parts.length > 0; }

  function draw(now){
    if(!parts.length){ last = 0; return; }
    if(!bind()) return;

    /* Tab bị ẩn rồi quay lại thì `now` nhảy vọt — kẹp dt lại, không thì cả
     * chùm giấy dịch chuyển tức thời ra ngoài màn hình trong đúng một khung. */
    if(!last || now - last > 300) last = now;
    let dt = (now - last)/1000;
    last = now;
    if(!(dt > 0)) dt = 1/60;
    if(dt > 0.05) dt = 0.05;

    const h = cv.clientHeight;
    ctx.save();
    for(let i=parts.length-1;i>=0;i--){
      const p = parts[i];
      p.life += dt;
      const k = 1 - DRAG*dt;
      p.vx *= k;
      p.vy = p.vy*k + GRAV*dt;
      p.x  += p.vx*dt;
      p.y  += p.vy*dt;
      p.rot += p.vr*dt;
      p.ph  += p.fr*dt;

      if(p.life > p.max || p.y > h + 80){ parts.splice(i, 1); continue; }

      const fade = p.life > p.max - FADE ? Math.max(0, (p.max - p.life)/FADE) : 1;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      /* Bóp ngang theo hình sin = mảnh giấy đang lật qua lật lại. Rẻ hơn nhiều
       * so với vẽ hình 3D mà đọc ra đúng cái cần đọc. */
      ctx.scale(Math.cos(p.ph), 1);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    ctx.restore();
  }

  window.Confetti = { burst:burst, draw:draw, clear:clear, active:active };
})();

</script>
<script>
/* ==== src/game.js ==== */
/* ============================================================================
 * game.js — Trạng thái, luật, input, vòng lặp.
 * ----------------------------------------------------------------------------
 * LUẬT (Cozy Mosaic):
 *   • Block KHÔNG BAO GIỜ xoay hay lật. Không thêm nút xoay dù "tiện".
 *   • Ô KHẢM (`picture.holes`) không đặt khối lên được; nó đã là một phần tranh.
 *   • Lúc chơi khối đã đặt giữ MÀU ĐẤT. Màu tranh chỉ hiện khi board lấp kín,
 *     loang từ tâm ra rìa.
 *   • Một block ĐƯỢC PHÉP nằm vắt qua nhiều vùng màu.
 *   • Khối đã đặt KÉO ĐƯỢC sang chỗ khác. Nhấc lên là rời board ngay nhưng
 *     KHÔNG cộng vào khay — nó đang ở trên tay, ×N phải đứng yên.
 *   • Thả đè lên khối khác thì khối bị đè VỀ KHAY, không từ chối cú thả.
 *   • Nước đi + mọi khối bị đẩy ra = MỘT bước hoàn tác.
 *   • Không timer, không giới hạn nước đi, không trạng thái thua, không sao.
 * ==========================================================================*/
(function(){
  const SHAPES = window.SHAPES;
  const LevelGen = window.LevelGen;
  const STORE = 'cozymosaic.save';
  const REVEAL_MS = 1400;

  const G = window.G = {
    level:null, index:0,
    rows:0, cols:0, occ:null, inPic:null, mosaic:null, colorAt:null,
    fill:null, blocked:null, placements:new Map(), nextPid:1, filled:0,
    deck:[], history:[],
    drag:null, pending:null,
    hintChip:-1, sel:-1, wallsActive:null,
    solved:false, solvedAt:0, revealT:0,
    /* Tint mờ 12% của bức tranh trên ô trống — người chơi tự bật/tắt. */
    showTint:true,
    /* Ba công tắc trong bảng Cài đặt, đều nhớ qua localStorage. */
    sound:true, haptic:true,
    unlocked:0, done:null
  };

  let cv, dg, deckEl, els = {};

  /* ------------------------------------------------------------ lưu tiến độ */
  function load(){
    G.done = new Set();
    try{
      const s = JSON.parse(localStorage.getItem(STORE) || '{}');
      G.unlocked = s.unlocked || 0;
      if(s.showTint != null) G.showTint = !!s.showTint;
      if(s.sound    != null) G.sound    = !!s.sound;
      if(s.haptic   != null) G.haptic   = !!s.haptic;
      (s.done || []).forEach(function(i){ G.done.add(i); });
      return s.last || 0;
    }catch(e){ return 0; }
  }
  function save(){
    try{
      localStorage.setItem(STORE, JSON.stringify({
        unlocked:G.unlocked, last:G.index, showTint:G.showTint,
        sound:G.sound, haptic:G.haptic, done:Array.from(G.done)
      }));
    }catch(e){}
  }

  /* ------------------------------------------------------------- nạp màn */
  function loadLevel(index){
    if(index < 0) index = 0;
    const lv = LevelGen.generateLevel(index);
    G.level = lv; G.index = index;
    G.rows = lv.rows; G.cols = lv.cols;
    G.occ = lv.occ; G.inPic = lv.inPic; G.mosaic = lv.mosaic; G.colorAt = lv.colorAt;
    G.deck = lv.deck.map(function(d){ return { shapeId:d.shapeId, total:d.total, left:d.total }; });
    G.wallsActive = (lv.walls && lv.walls.count) ? lv.walls : null;
    G.fill = new Int16Array(lv.rows*lv.cols).fill(-1);
    G.blocked = Uint8Array.from(lv.occ);
    G.placements = new Map(); G.nextPid = 1; G.filled = 0;
    G.history = []; G.drag = null; G.pending = null; G.hintChip = -1; G.sel = -1;
    G.solved = false; G.solvedAt = 0; G.revealT = 0;
    if(window.Confetti) window.Confetti.clear();   // sang màn khác thì tắt pháo
    if(window.FX) window.FX.clear();     // đổi màn: bỏ hết hiệu ứng còn dở

    /* CHƠI THEO VÙNG — HIỆN CHỈ BẬT Ở MÀN 11.
     *
     * `level.regions` do gen.js dựng cho MỌI màn có tường (từ màn 6), nhưng
     * lối chơi soi-từng-ổ mới chỉ chốt ở màn 11. Mấy màn còn lại vẫn chơi
     * nguyên board, tường vẽ ra như cũ.
     *
     * Muốn mở rộng thì thêm index vào mảng này, không phải sửa chỗ nào khác —
     * dữ liệu vùng đã có sẵn ở mọi màn có tường. */
    const ZOOM_LEVELS = [10];                   // index 10 = MÀN 11
    G.regions   = (ZOOM_LEVELS.indexOf(index) >= 0 && lv.regions && lv.regions.length > 1)
                  ? lv.regions : null;
    G.regionIdx = 0;
    G.activeCells = null;
    G.regionRect  = null;
    G.regionCells = null;
    if(G.regions) enterRegion(0, false, 1100);   // xem cả bức 1,1 s rồi mới zoom
    else window.R.setView(null, false);

    hideOverlays();
    window.R.buildDeck();
    syncHud();
    window.R.fitBoard();
    save();
    prewarm(index + 1);
  }

  /* Sinh trước màn kế tiếp lúc máy rảnh. Màn 5 (cá voi) sinh mất ~2 giây vì
   * board to + có tường + cổng chất lượng khắt khe; làm sẵn từ lúc chơi màn 4
   * thì lúc bấm sang không còn khựng. LevelGen tự nhớ theo số màn. */
  function prewarm(i){
    if(i >= window.PICTURES.length + 12) return;
    const run = function(){ try{ LevelGen.generateLevel(i); }catch(e){} };
    if(window.requestIdleCallback) requestIdleCallback(run, { timeout:2500 });
    else setTimeout(run, 400);
  }

  /* -------------------------------------------------------------- đặt / gỡ */
  function doPlace(shapeId, idxs){
    const pid = G.nextPid++;
    G.placements.set(pid, { id:pid, shapeId:shapeId, idxs:idxs });
    for(let k=0;k<idxs.length;k++){ G.fill[idxs[k]] = pid; G.blocked[idxs[k]] = 1; }
    G.filled += idxs.length;
    /* Mọi đường đưa một khối lên board đều đi qua đây — đặt mới, hoàn tác, trả
     * về chỗ cũ — nên gắn cú nén-bật ở đây là đủ, không phải rải ra từng chỗ.
     * Riêng đường chạm-chip-rồi-chạm-board thì `commit` lát nữa đổi lại thành
     * bay-từ-khay-lên. */
    if(window.FX) window.FX.land(pid);
    return pid;
  }

  /* Khối rời board thì BAY VỀ Ô KHAY của chính nó. Luật 6 và luật 8 đều nói
   * khối không mất đi đâu cả, nó về khay — cho người chơi nhìn thấy đúng thế.
   * `hand` (toạ độ màn hình) dùng khi khối đang ở đầu ngón tay chứ không còn ở
   * chỗ cũ trên board. */
  function trayFly(p, hand){
    if(!window.FX || !p) return;
    const pt = window.R.chipPoint(p.shapeId);
    window.FX.flyOut(p.id, p.shapeId, p.idxs, pt, hand);
  }
  function doRemove(pid){
    const p = G.placements.get(pid);
    if(!p) return null;
    for(let k=0;k<p.idxs.length;k++){ G.fill[p.idxs[k]] = -1; G.blocked[p.idxs[k]] = 0; }
    G.filled -= p.idxs.length;
    G.placements.delete(pid);
    return p;
  }
  function deckOf(shapeId){
    for(let k=0;k<G.deck.length;k++) if(G.deck[k].shapeId === shapeId) return G.deck[k];
    return null;
  }
  function deckIndexOf(shapeId){
    for(let k=0;k<G.deck.length;k++) if(G.deck[k].shapeId === shapeId) return k;
    return -1;
  }

  /* Ô THẢ ĐƯỢC: trong tranh, không phải ô khảm, không vắt qua tường (nếu bật).
   * Ô đang có khối khác thì VẪN THẢ ĐƯỢC — khối kia sẽ bị đẩy về khay. */
  function dropCells(shapeId, r, c){
    const sh = SHAPES[shapeId], out = [];
    for(let t=0;t<sh.cells.length;t++){
      const rr = sh.cells[t][0] + r, cc = sh.cells[t][1] + c;
      if(rr<0 || rr>=G.rows || cc<0 || cc>=G.cols) return null;
      const i = rr*G.cols + cc;
      if(!G.inPic[i] || G.mosaic[i]) return null;
      /* Ngoài ổ đang soi thì cấm. Tường đã cấm khối VẮT QUA ranh giới, nhưng
       * chưa cấm đặt gọn trong một ổ KHÁC — mà khay giờ là khay riêng của ổ
       * này, đặt lạc sang ổ khác là hỏng sổ sách của cả hai bên. */
      if(G.activeCells && !G.activeCells[i]) return null;
      out.push(i);
    }
    const W = G.wallsActive;
    if(W){
      for(let t=0;t<sh.edgesR.length;t++)
        if(W.R[(sh.edgesR[t][0]+r)*G.cols + sh.edgesR[t][1]+c]) return null;
      for(let t=0;t<sh.edgesD.length;t++)
        if(W.D[(sh.edgesD[t][0]+r)*G.cols + sh.edgesD[t][1]+c]) return null;
    }
    return out;
  }
  /* Đặt khối sao cho nó PHỦ ô vừa chạm. Thử mọi cách neo (ô nào của khối rơi
   * vào ô đã chạm), rồi mới nới ra quanh đó — cùng tinh thần "thả đâu cũng
   * được" của thao tác kéo. */
  function placeAtCell(shapeId, cellIdx){
    const sh = SHAPES[shapeId];
    const tr = (cellIdx/G.cols)|0, tc = cellIdx%G.cols;
    for(let t=0;t<sh.cells.length;t++){
      const idxs = dropCells(shapeId, tr - sh.cells[t][0], tc - sh.cells[t][1]);
      if(idxs) return idxs;
    }
    for(let d=1; d<=2; d++)
      for(let dr=-d; dr<=d; dr++) for(let dc=-d; dc<=d; dc++){
        if(Math.max(Math.abs(dr), Math.abs(dc)) !== d) continue;
        for(let t=0;t<sh.cells.length;t++){
          const idxs = dropCells(shapeId, tr+dr - sh.cells[t][0], tc+dc - sh.cells[t][1]);
          if(idxs) return idxs;
        }
      }
    return null;
  }

  /* ------------------------------------------------------------------- VÙNG
   * Vào ổ thứ `k`: khung nhìn zoom vào đúng ổ đó, và KHAY CHỈ BÀY KHỐI CỦA Ổ
   * ĐÓ.
   *
   * Khay riêng từng ổ mới là chỗ ăn tiền, không phải cái zoom. Khay dùng chung
   * cả board thì lấp kín một ổ bằng bộ khối sai vẫn lọt — hỏng chỉ lộ ra ở ổ
   * kế bên lúc không còn khối vừa, mà lúc đó gỡ lại đã muộn. Khay riêng thì
   * lấp đúng ổ là đúng toàn cục: hết đường lọt.
   *
   * Lịch sử hoàn tác xoá theo từng ổ — ổ đã xong là xong, không lùi ngược qua
   * ranh giới được. Ổ chỉ 3–6 khối nên chẳng mất gì. */
  function enterRegion(k, animate, hold){
    const rg = G.regions[k];
    G.regionIdx = k;
    G.activeCells = new Uint8Array(G.rows*G.cols);
    for(let q=0;q<rg.cells.length;q++) G.activeCells[rg.cells[q]] = 1;
    G.regionCells = rg.cells;                  // render khoét màn mờ theo hình này
    G.regionRect = { r0:rg.r0, c0:rg.c0, r1:rg.r1, c1:rg.c1 };
    G.deck = rg.deck.map(function(d){
      return { shapeId:d.shapeId, total:d.total, left:d.total };
    });
    G.sel = -1; G.hintChip = -1; G.history = [];

    /* `hold` > 0: đứng ở HÌNH TỔNG chừng đó rồi mới zoom vào ổ đầu.
     *
     * Vào màn mà đã nằm sẵn trong ổ thì người chơi không biết mình đang ở đâu
     * trong bức tranh, cũng không biết bức tranh là hình gì. Cho xem cả bức —
     * tường vẽ ra, thấy rõ nó chia thành mấy ổ — rồi mới bổ nhào vào ổ đầu. */
    if(hold > 0){
      window.R.setView(null, false);
      setTimeout(function(){
        if(G.regions && G.regionIdx === k && !G.solved)
          window.R.setView(G.regionRect, true);
      }, hold);
    } else {
      window.R.setView(G.regionRect, animate);
    }
    window.R.buildDeck();
    syncHud();
  }

  function regionDone(){
    if(!G.regions) return false;
    const cells = G.regions[G.regionIdx].cells;
    for(let q=0;q<cells.length;q++) if(G.fill[cells[q]] < 0) return false;
    return true;
  }

  function occupantsOf(idxs){
    const set = {}, list = [];
    for(let k=0;k<idxs.length;k++){
      const pid = G.fill[idxs[k]];
      if(pid >= 0 && !set[pid]){ set[pid] = 1; list.push(pid); }
    }
    return list;
  }

  /* --------------------------------------------------------- một nước đi
   * Đặt khối + đẩy mọi khối bị đè về khay, gộp thành MỘT bước hoàn tác. */
  function commit(shapeId, cells, opt){
    opt = opt || {};
    const evicted = [];
    const victims = occupantsOf(cells);
    for(let k=0;k<victims.length;k++){
      const p = doRemove(victims[k]);
      if(!p) continue;
      deckOf(p.shapeId).left++;
      evicted.push({ shapeId:p.shapeId, idxs:p.idxs });
      trayFly(p);
    }
    const pid = doPlace(shapeId, cells.slice());
    if(opt.fromDeck) deckOf(shapeId).left--;
    /* CHẠM chip rồi CHẠM board: khối thật sự đi từ khay lên, nên cho nó bay.
     * Kéo thả thì không — lúc thả, khối đã nằm sẵn dưới ngón tay đúng ô đó. */
    if(opt.tap && window.FX)
      window.FX.flyIn(pid, shapeId, cells, window.R.chipPoint(shapeId));
    G.history.push({ shapeId:shapeId, to:cells.slice(),
                     from: opt.origin ? opt.origin.slice() : null,
                     fromDeck: !!opt.fromDeck, evicted:evicted });
    G.hintChip = -1;
    sfx(evicted.length ? 'push' : 'place');
    after();
  }

  function undo(){
    const a = G.history.pop();
    if(!a) return;
    const pid = G.fill[a.to[0]];
    let gone = null;
    if(pid >= 0 && !a.returned) gone = doRemove(pid);
    if(a.returned){                       // nước "chạm để trả về khay"
      doPlace(a.shapeId, a.to.slice());
      deckOf(a.shapeId).left--;
    } else {
      // trả các khối bị đẩy ra về đúng chỗ cũ, rồi mới tới khối gốc
      for(let k=0;k<a.evicted.length;k++){
        doPlace(a.evicted[k].shapeId, a.evicted[k].idxs.slice());
        deckOf(a.evicted[k].shapeId).left--;
      }
      /* Khối gốc đi đâu thì hoàn tác phải cho nó bay về đúng chỗ đó: về khay
       * nếu nó vốn lấy từ khay, còn không thì về chỗ cũ trên board (doPlace tự
       * lo cú nén-bật). */
      if(a.fromDeck){ deckOf(a.shapeId).left++; trayFly(gone); }
      else if(a.from) doPlace(a.shapeId, a.from.slice());
    }
    G.solved = false; G.revealT = 0; G.hintChip = -1;
    els.win.classList.remove('on');
    sfx('pull');
    after();
  }

  /* Chạm khối đã đặt (không kéo) → trả nó về khay. */
  function pull(pid){
    const p = G.placements.get(pid);
    if(!p) return false;
    doRemove(pid);
    deckOf(p.shapeId).left++;
    trayFly(p);
    G.history.push({ shapeId:p.shapeId, to:p.idxs.slice(), from:null,
                     fromDeck:false, evicted:[], returned:true });
    G.hintChip = -1;
    sfx('pull');
    after();
    return true;
  }

  function restart(){ loadLevel(G.index); }

  function after(){
    window.R.syncDeck();
    syncHud();
    /* Lấp kín ổ đang soi ⇒ trượt sang ổ kế. Chờ một nhịp cho cú nén-bật của
     * khối cuối chạy xong rồi mới dời khung nhìn — dời ngay thì hai chuyển
     * động chồng lên nhau, nhìn giật. */
    if(G.regions && !G.solved && regionDone()){
      if(G.regionIdx + 1 < G.regions.length){
        const next = G.regionIdx + 1;
        setTimeout(function(){
          if(!G.solved && G.regions && G.regionIdx === next-1) enterRegion(next, true);
        }, 420);
        return;
      }
      /* Ổ cuối xong = cả bức xong. Kéo khung nhìn về CẢ BOARD rồi mới ăn mừng:
       * người chơi phải thấy trọn bức tranh mình vừa ghép. */
      G.activeCells = null; G.regionRect = null; G.regionCells = null;
      window.R.setView(null, true);
    }
    if(!G.solved && G.filled === G.level.playable) win();
    /* KHÔNG có thông báo "hết đường" — chủ tài liệu thấy nó phiền. Chỗ dựa còn
     * lại: cổng chất lượng đã siết (mỗi màn ≥40 cách lát), hoàn tác vô hạn, và
     * luật thả-đè-thì-đẩy-khối-kia-về-khay nên hiếm khi thật sự tắc. */
  }

  /* ---------------------------------------------------------------- gợi ý
   * Gợi ý KHÔNG lộ nguyên đáp án — nó ĐẶT SẴN MỘT KHỐI ĐÚNG. */
  function hint(){
    if(G.solved) return;
    /* Chơi theo ổ thì gợi ý chỉ được lấy trong LỜI GIẢI CỦA Ổ ĐANG SOI. Lấy cả
     * bàn thì nó đặt sang ổ khác — mà `dropCells` đã cấm, nên gợi ý sẽ im lặng
     * không làm gì và người chơi tưởng nút hỏng. */
    const pool = (G.regions ? G.regions[G.regionIdx].pieces : G.level.solution);
    const ready = pool.filter(function(p){
      const d = deckOf(p.shapeId);
      if(!d || d.left <= 0) return false;
      for(let k=0;k<p.idxs.length;k++) if(G.blocked[p.idxs[k]]) return false;
      return true;
    });
    let pick = ready.length ? ready[(Math.random()*ready.length)|0] : null;

    if(!pick){
      const counts = {};
      for(let k=0;k<G.deck.length;k++) if(G.deck[k].left > 0) counts[G.deck[k].shapeId] = G.deck[k].left;
      if(!Object.keys(counts).length) return;
      /* Đường cứu: giải lại từ thế cờ hiện tại. Chơi theo ổ thì phải KHOÁ HẾT
       * phần ngoài ổ lại trước, không thì solver đi lát sang ổ bên cạnh bằng
       * khay của ổ này. */
      let occ = G.blocked;
      if(G.activeCells){
        occ = Uint8Array.from(G.blocked);
        for(let i=0;i<occ.length;i++) if(!G.activeCells[i]) occ[i] = 1;
      }
      const res = LevelGen.solve(occ, G.rows, G.cols, counts,
                                 { budget:400000, timeMs:400, walls:G.wallsActive });
      if(res.status !== 'solved'){ nudge(); return; }
      const p = res.placements[(Math.random()*res.placements.length)|0];
      pick = { shapeId:p.id, idxs:p.idxs };
    }
    commit(pick.shapeId, pick.idxs.slice(), { fromDeck:true });
    G.hintChip = deckIndexOf(pick.shapeId);
    window.R.syncDeck();
    window.R.scrollChipIntoView(G.hintChip);
  }

  function nudge(){
    els.card.classList.remove('nudge');
    void els.card.offsetWidth;
    els.card.classList.add('nudge');       // lắc nhẹ card, không nói gì
  }

  /* ---------------------------------------------------------------- thắng */
  function win(){
    G.solved = true; G.solvedAt = performance.now();
    G.drag = null; G.pending = null;
    if(G.index + 1 > G.unlocked) G.unlocked = G.index + 1;
    G.done.add(G.index);
    save(); syncHud();
    sfx('win');
    /* PHÁO GIẤY: loạt đầu nổ ngay cùng tiếng thắng, loạt hai sau 0,55 s.
     * Hai loạt chứ không phải một loạt to — một loạt thì đỉnh điểm qua mất
     * trước khi bức tranh kịp lên màu xong (mất REVEAL_MS), hai loạt kéo dài
     * đúng qua cú loang màu. */
    if(window.Confetti){
      window.Confetti.burst();
      setTimeout(function(){ if(G.solved) window.Confetti.burst(); }, 550);
    }
    setTimeout(showWin, REVEAL_MS + 350);
  }

  /* ------------------------------------------------------------------ HUD */
  /* GAME KHÔNG CHỮ: HUD chỉ còn SỐ màn. Không caption, không tên tranh, không
   * câu hướng dẫn, không thông báo — mọi thứ nói bằng hình. */
  function syncHud(){
    els.level.textContent = G.index + 1;
    /* Ba công tắc nằm trong bảng Cài đặt chứ không còn trên thanh trên. */
    els.rowTint.classList.toggle('on', G.showTint);
    els.rowSound.classList.toggle('on', G.sound);
    els.rowHaptic.classList.toggle('on', G.haptic);
    const pics = new Set();
    G.done.forEach(function(i){ pics.add(i % window.PICTURES.length); });
    els.galCount.textContent = pics.size + ' / ' + window.PICTURES.length + ' bức ›';
  }

  function hideOverlays(){
    els.win.classList.remove('on');
    els.gallery.classList.remove('on');
    els.settings.classList.remove('on');
  }
  function showWin(){
    els.winArt.innerHTML = picThumb(G.level.picture, 14);   // chính bức vừa lắp
    els.win.classList.add('on');
  }

  /* --------------------------------------------------------- phòng tranh */
  /* Phòng tranh giờ kiêm luôn BẢNG CHỌN MÀN — hai nút ‹ › đã rời thanh trên,
   * đây là đường duy nhất để quay lại màn cũ. Màn đã xong hiện bức tranh; màn
   * đã mở mà chưa xong để trống, vì bức tranh chính là phần thưởng. */
  function openGallery(){
    const open = Math.max(G.unlocked, G.index) + 1;
    let html = '';
    for(let i=0;i<open;i++){
      const pic  = window.PICTURES[i % window.PICTURES.length];
      const done = G.done.has(i);
      html += '<button class="frame' + (i === G.index ? ' cur' : '') + '" data-lv="' + i + '">' +
              (done ? picThumb(pic, 8) : '<div class="thumb-empty"></div>') +
              '<b>' + (i+1) + '</b></button>';
    }
    for(let k=0;k<3;k++)
      html += '<div class="frame locked"><div class="thumb-empty"></div><b>' +
              (open+k+1) + '</b></div>';
    els.galGrid.innerHTML = html;
    els.settings.classList.remove('on');
    els.gallery.classList.add('on');
  }
  /* Bức tranh hiện ở bảng kết màn và ở phòng tranh.
   *
   * Hai ô cạnh nhau vẽ SÁT nhau thì mép chung vẫn bị khử răng cưa: mỗi bên chỉ
   * phủ nửa điểm ảnh, cộng lại vẫn hở ra nền trắng — thành một cái lưới kẻ ô
   * chạy khắp bức tranh. Nên phải cho hai ô ĐÈ nhau nửa điểm ảnh, và tắt luôn
   * khử răng cưa: tranh lắp xong phải là MỘT hình liền.
   *
   * Gom theo màu rồi tô một path — mấy ô cùng màu kề nhau nhập hẳn làm một
   * mảng, không còn mép chung nào để mà hở. */
  function picThumb(pic, px){
    const rows = pic.art.length, cols = pic.art[0].length;
    const byCol = {};
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const col = pic.palette[pic.art[r][c]];
      if(col == null) continue;
      (byCol[col] = byCol[col] || []).push([r,c]);
    }
    let s = '<svg class="thumb" shape-rendering="crispEdges" viewBox="0 0 '
          + (cols*px)+' '+(rows*px)+'" width="'+(cols*px)+'" height="'+(rows*px)+'">';
    const o = 0.5;                     // đè nhau nửa điểm ảnh
    for(const col in byCol){
      let d = '';
      const list = byCol[col];
      for(let k=0;k<list.length;k++){
        const x = list[k][1]*px - o, y = list[k][0]*px - o, w = px + 2*o;
        d += 'M'+x+','+y+'h'+w+'v'+w+'h'+(-w)+'Z';
      }
      s += '<path d="'+d+'" fill="'+col+'"/>';
    }
    return s + '</svg>';
  }

  /* ---------------------------------------------------------------- âm nhỏ */
  let AC = null;
  function sfx(kind){
    try{
      /* Rung đi kèm mọi tiếng động, nhưng là công tắc riêng. */
      if(G.haptic && navigator.vibrate)
        navigator.vibrate(kind === 'win' ? [16,40,16] : 9);
      if(!G.sound) return;
      if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state === 'suspended') AC.resume();
      const seq = { place:[[440,0,.07]], pull:[[262,0,.07]], push:[[330,0,.06],[220,.06,.09]],
                    win:[[523,0,.13],[659,.11,.13],[784,.22,.13],[1046,.33,.30]] }[kind];
      if(!seq) return;
      for(let k=0;k<seq.length;k++){
        const f = seq[k][0], at = AC.currentTime + seq[k][1], dur = seq[k][2];
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.11, at+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
        o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at+dur+0.02);
      }
    }catch(e){}
  }

  /* ---------------------------------------------------------------- input */
  function localPos(e){
    const b = cv.getBoundingClientRect();
    return [e.clientX - b.left, e.clientY - b.top];
  }

  function updateDrag(px, py){
    const d = G.drag, L = window.L, cell = L.cell;
    d.left = px + d.offX;
    d.top  = py + d.offY;

    const fr = (d.top - L.by)/cell, fc = (d.left - L.bx)/cell;
    const r0 = Math.round(fr), c0 = Math.round(fc);
    /* Thả ở ĐÂU CŨNG ĐƯỢC: không bắt người chơi canh đúng ô. Quét cả vùng ±3 ô
     * quanh chỗ thả và nhận vị trí HỢP LỆ GẦN NHẤT — kể cả khi khối đang thò ra
     * ngoài tranh hay đè lên ô khảm, nó tự trượt vào chỗ vừa. Chỉ khi cả vùng
     * không còn chỗ nào đặt được thì khối mới quay về. */
    /* HÚT VÀO CHỖ CÒN TRỐNG. Chấm điểm = khoảng cách CỘNG tiền phạt cho mỗi ô
     * đã có khối mà mình đè lên. Phạt 2,2 ô nghĩa là: chỗ trống nào nằm trong
     * bán kính 2,2 ô luôn thắng chỗ phải đè một viên — khối tự trượt vào lỗ
     * thay vì hất khối cũ ra. Hết chỗ trống thì vị trí đè vẫn nhận, nên vẫn
     * đặt chồng được khi thật sự muốn. */
    const DE = 2.2;
    let best = null, bestScore = Infinity;
    for(let dr=-3;dr<=3;dr++) for(let dc=-3;dc<=3;dc++){
      const r = r0+dr, c = c0+dc;
      const dist = Math.sqrt((r-fr)*(r-fr) + (c-fc)*(c-fc));
      if(dist > 3.2) continue;
      const idxs = dropCells(d.shapeId, r, c);
      if(!idxs) continue;
      let chong = 0;
      for(let k=0;k<idxs.length;k++) if(G.fill[idxs[k]] >= 0) chong++;
      const score = dist + DE*chong;
      if(score >= bestScore) continue;
      bestScore = score; best = { r:r, c:c, idxs:idxs };
    }
    d.snap = best;
    /* Ngón tay có đang ở NGOÀI board không — thả ở ngoài là gỡ khối. */
    d.out = px < L.bx - cell*0.5 || px > L.bx + G.cols*cell + cell*0.5 ||
            py < L.by - cell*0.5 || py > L.by + G.rows*cell + cell*0.5;
    /* Vẽ trước cái giá: khối nào sắp bị đẩy ra khay. */
    d.evict = best ? occupantsOf(best.idxs).map(function(pid){
      return G.placements.get(pid).idxs;
    }) : [];
  }

  function startDrag(shapeId, from, px, py, extra){
    const L = window.L, sh = SHAPES[shapeId], cell = L.cell;
    G.pending = null;
    G.drag = Object.assign({
      shapeId:shapeId, from:from, left:0, top:0, snap:null, evict:[], origin:null,
      /* Kéo từ khay: khối nâng cao hơn ngón tay để không bị che. Nhấc từ board
       * thì `liftFromBoard` ghi đè offX/offY để GIỮ NGUYÊN viên gạch đã chạm. */
      offX: -sh.w*cell/2,
      offY: -(cell*1.35 + 16) - sh.h*cell/2
    }, extra || {});
    document.body.classList.add('dragging');
    G.sel = -1;
    updateDrag(px, py);
  }

  function sameCells(a, b){
    if(!a || !b || a.length !== b.length) return false;
    for(let k=0;k<a.length;k++) if(a[k] !== b[k]) return false;
    return true;
  }

  function endDrag(){
    const d = G.drag;
    G.drag = null;
    document.body.classList.remove('dragging');
    if(!d) return;

    /* KÉO RA NGOÀI BOARD = GỠ. Khối nhấc từ board mà thả ở ngoài khung tranh
     * thì trả thẳng về khay, không bò về chỗ cũ. Cùng với chạm-để-gỡ, người
     * chơi có hai đường bỏ một khối đã đặt.
     *
     * liftFromBoard đã doRemove nhưng CHƯA cộng vào khay (lúc đó khối đang ở
     * trên tay), nên ở đây phải cộng. */
    if(d.from === 'board' && d.out){
      const slot = deckOf(d.shapeId);
      if(slot) slot.left++;
      /* Bay về khay TỪ ĐẦU NGÓN TAY, không phải từ chỗ cũ trên board — lúc này
       * khối đang ở trên tay, chỗ cũ đã trống từ lúc nhấc lên rồi. */
      const b = cv.getBoundingClientRect(), sh = SHAPES[d.shapeId], cell = window.L.cell;
      trayFly({ id:d.pid, shapeId:d.shapeId, idxs:d.origin },
              { x: b.left + d.left + sh.w*cell/2, y: b.top + d.top + sh.h*cell/2 });
      G.history.push({ shapeId:d.shapeId, to:d.origin.slice(), from:null,
                       fromDeck:false, evicted:[], returned:true });
      G.hintChip = -1;
      sfx('pull');
      after();
      return;
    }

    if(!d.snap){                                   // ra ngoài tranh / lên ô khảm
      if(d.from === 'board') doPlace(d.shapeId, d.origin.slice());
      window.R.syncDeck();
      return;                                      // KHÔNG ghi undo
    }
    if(d.from === 'board' && sameCells(d.snap.idxs, d.origin)){
      doPlace(d.shapeId, d.origin.slice());        // nhích trong cùng một ô
      window.R.syncDeck();
      return;                                      // KHÔNG ghi undo
    }
    commit(d.shapeId, d.snap.idxs, { fromDeck: d.from === 'deck', origin: d.origin });
  }

  /* ---- chạm xuống khay ---- */
  function onChipDown(e){
    if(G.solved) return;
    const chip = e.target.closest ? e.target.closest('.chip') : null;
    let i = chip ? +chip.dataset.i : -1;
    if(!(i >= 0) || !G.deck[i] || G.deck[i].left <= 0) i = -1;
    /* `chip:-1` = chạm vào khoảng trống của khay (hoặc vào ô đã dùng hết).
     * Vẫn ghi nhận, vì từ đó KÉO NGANG để cuộn khay là hợp lệ — chỉ không nhấc
     * được khối nào lên thôi. */
    G.pending = { chip:i, x0:e.clientX, y0:e.clientY,
                  sl0:deckEl.scrollLeft, scroll:false, dx0:0 };
    listen();
  }

  /* ---- chạm xuống board (chạm = trả về khay, kéo = nhấc lên) ---- */
  function onBoardDown(e){
    if(G.solved || G.drag) return;
    const p = localPos(e);
    const i = window.R.boardIndexAt(p[0], p[1]);
    if(i < 0) return;

    if(G.sel >= 0 && G.deck[G.sel] && G.deck[G.sel].left > 0){
      const cells = placeAtCell(G.deck[G.sel].shapeId, i);
      if(cells){
        const id = G.deck[G.sel].shapeId;
        commit(id, cells, { fromDeck:true, tap:true });
        if(!deckOf(id) || deckOf(id).left <= 0) G.sel = -1;   // hết hàng thì bỏ chọn
        window.R.syncDeck();
      }
      return;
    }

    if(G.mosaic[i]) return;
    /* Khối nằm trong ổ ĐÃ XONG: khoá luôn. Gỡ nó ra thì khay hiện tại không có
     * chỗ trả về (khay là của ổ này), sổ sách vỡ ngay. */
    if(G.activeCells && !G.activeCells[i]) return;
    const pid = G.fill[i];
    if(pid < 0) return;
    G.pending = { pid:pid, x0:e.clientX, y0:e.clientY, px:p[0], py:p[1] };
    listen();
  }

  function liftFromBoard(pend, px, py){
    const L = window.L, cell = L.cell;
    const p = G.placements.get(pend.pid);
    if(!p) return;
    const origin = p.idxs.slice();
    let minR = Infinity, minC = Infinity;
    for(let k=0;k<origin.length;k++){
      const r = (origin[k]/G.cols)|0, c = origin[k]%G.cols;
      if(r < minR) minR = r;
      if(c < minC) minC = c;
    }
    const left = L.bx + minC*cell, top = L.by + minR*cell;
    doRemove(pend.pid);          // rời board ngay…
    // …nhưng KHÔNG cộng vào khay: nó đang ở trên tay, ×N phải đứng yên.
    startDrag(p.shapeId, 'board', px, py, {
      origin: origin,
      pid: pend.pid,             // để lát nữa còn biết lấy lệch sắc độ của khối nào

      offX: left - pend.px,      // giữ đúng viên gạch đã chạm dưới ngón tay
      offY: top  - pend.py
    });
  }

  function listen(){
    window.addEventListener('pointermove', onWinMove, { passive:false });
    window.addEventListener('pointerup', onWinUp);
    window.addEventListener('pointercancel', onWinUp);
  }
  function onWinMove(e){
    const pend = G.pending;
    if(pend){
      const dx = e.clientX - pend.x0, dy = e.clientY - pend.y0;
      if(pend.pid != null){
        if(Math.abs(dx) > 6 || Math.abs(dy) > 6){
          const p = localPos(e);
          liftFromBoard(pend, p[0], p[1]);
        }
      } else if(pend.scroll){
        /* ĐANG CUỘN KHAY. Trừ đi `dx0` — quãng đã đi lúc vượt ngưỡng — để khay
         * không giật nảy một cái ngay khi bắt đầu cuộn. */
        deckEl.scrollLeft = pend.sl0 - (dx - pend.dx0);
        e.preventDefault();
      } else {
        /* Hai cử chỉ cùng bắt đầu từ ô khay, phân biệt bằng HƯỚNG:
         *   đi LÊN   ⇒ nhấc khối ra khỏi khay;
         *   đi NGANG ⇒ cuộn khay để với tới mấy ô còn khuất ngoài khung.
         * Trên điện thoại `touch-action:pan-x` đã cho trình duyệt tự cuộn, còn
         * đây là đường dành cho CHUỘT — chuột không có touch-action nào cả, nên
         * trước giờ kéo ngang bằng chuột không ăn gì. */
        if(pend.chip >= 0 &&
           (dy < -8 || (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)))){
          const p = localPos(e);
          startDrag(G.deck[pend.chip].shapeId, 'deck', p[0], p[1], { chip:pend.chip });
        } else if(Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)
                  && window.R.deckScrollable()){
          pend.scroll = true; pend.dx0 = dx;
          deckEl.classList.add('grabbing');
          e.preventDefault();
        }
      }
    }
    if(G.drag){
      e.preventDefault();
      const p = localPos(e);
      updateDrag(p[0], p[1]);
    }
  }
  function onWinUp(e){
    window.removeEventListener('pointermove', onWinMove);
    window.removeEventListener('pointerup', onWinUp);
    window.removeEventListener('pointercancel', onWinUp);
    const pend = G.pending;
    G.pending = null;
    deckEl.classList.remove('grabbing');
    if(!G.drag && pend){
      if(pend.pid != null){ pull(pend.pid); return; }        // chạm khối đã đặt
      /* Vừa CUỘN khay xong thì không phải cú chạm chọn. Cũng không chọn khi
       * trình duyệt HUỶ pointer — trên điện thoại, cú vuốt ngang bị nó nuốt để
       * tự cuộn và bắn ra `pointercancel`; tính đó là chạm thì vuốt tới vuốt
       * lui một hồi là chọn nhầm khối. */
      if(pend.scroll || pend.chip < 0) return;
      if(e && e.type === 'pointercancel') return;
      /* Chạm ô khay mà không kéo ⇒ CHỌN khối. Chạm tiếp vào tranh là đặt.
       * Đường này để chuột trên máy tính (và mọi chỗ mà cử chỉ kéo không ăn)
       * vẫn chơi được, chứ không bắt buộc phải kéo. */
      G.sel = (G.sel === pend.chip) ? -1 : pend.chip;
      window.R.syncDeck();
      return;
    }
    endDrag();
  }

  /* ----------------------------------------------------------------- loop */
  function frame(now){
    if(window.FX) window.FX.tick(now);
    if(G.solved && G.revealT < 1) G.revealT = Math.min(1, (now - G.solvedAt)/REVEAL_MS);
    window.R.draw(now);
    window.R.drawDrag();
    /* SAU drawDrag: hàm đó xoá sạch #dragLayer và đặt sẵn phép biến đổi theo
     * DPR mỗi khung, nên pháo giấy vẽ ở đây là nằm trên cùng và dùng luôn toạ
     * độ pixel CSS. */
    if(window.Confetti) window.Confetti.draw(now);
    requestAnimationFrame(frame);
  }

  /* ----------------------------------------------------------------- boot */
  function boot(){
    cv = document.getElementById('cv');
    dg = document.getElementById('dragLayer');
    deckEl = document.getElementById('deck');
    window.R.bind(cv, dg, deckEl);

    els = {
      card:document.getElementById('card'),
      level:document.getElementById('hudLevel'),
      win:document.getElementById('win'), winArt:document.getElementById('winArt'),
      gallery:document.getElementById('gallery'),
      galGrid:document.getElementById('galGrid'),
      settings:document.getElementById('settings'),
      rowTint:document.getElementById('rowTint'),
      rowSound:document.getElementById('rowSound'),
      rowHaptic:document.getElementById('rowHaptic'),
      galCount:document.getElementById('galCount')
    };

    loadLevel(load());

    deckEl.addEventListener('pointerdown', onChipDown);
    /* Con lăn chuột trên khay = cuộn NGANG. Khay chỉ cao 66px, cuộn dọc không
     * có gì để cuộn — lăn mà khay không nhúc nhích thì người chơi kết luận là
     * khay chỉ có bấy nhiêu ô. Nhận cả deltaX (chuột/trackpad cuộn ngang). */
    deckEl.addEventListener('wheel', function(ev){
      if(!window.R.deckScrollable()) return;
      const d = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : ev.deltaY;
      if(!d) return;
      deckEl.scrollLeft += d;
      ev.preventDefault();
    }, { passive:false });
    cv.addEventListener('pointerdown', onBoardDown);

    function toggle(key){ G[key] = !G[key]; syncHud(); save(); }
    els.rowTint.onclick   = function(){ toggle('showTint'); };
    els.rowSound.onclick  = function(){ toggle('sound'); if(G.sound) sfx('place'); };
    els.rowHaptic.onclick = function(){ toggle('haptic'); if(G.haptic) sfx('pull'); };
    document.getElementById('rowGallery').onclick  = openGallery;
    document.getElementById('btnRestart').onclick  = restart;
    document.getElementById('btnSettings').onclick = function(){ els.settings.classList.add('on'); };
    document.getElementById('setClose').onclick    = function(){ els.settings.classList.remove('on'); };
    document.getElementById('btnHint').onclick     = hint;
    document.getElementById('btnUndo').onclick     = undo;
    document.getElementById('galClose').onclick    = function(){ els.gallery.classList.remove('on'); };
    els.galGrid.onclick = function(e){
      const f = e.target.closest('[data-lv]');
      if(f) loadLevel(+f.dataset.lv);
    };
    document.getElementById('btnAgain').onclick   = restart;
    document.getElementById('btnGo').onclick      = function(){ loadLevel(G.index+1); };

    window.addEventListener('keydown', function(e){
      if(e.key === 'z' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); undo(); }
      else if(e.key === 'r') restart();
      else if(e.key === 'h') hint();
    });
    window.addEventListener('resize', function(){ window.R.fitBoard(); });

    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------- QA hooks */
  window.CM_QA = {
    go: function(i){ loadLevel(i); return G.index; },
    solve: function(){
      const plan = G.level.solution.slice();
      for(let k=0;k<plan.length;k++){
        const p = plan[k];
        let free = true;
        for(let q=0;q<p.idxs.length;q++) if(G.blocked[p.idxs[q]]) free = false;
        if(free && deckOf(p.shapeId).left > 0) commit(p.shapeId, p.idxs.slice(), { fromDeck:true });
      }
      return G.filled === G.level.playable && G.deck.every(function(d){ return d.left === 0; });
    },
    count: function(cap){
      const counts = {};
      for(let k=0;k<G.deck.length;k++) if(G.deck[k].left>0) counts[G.deck[k].shapeId] = G.deck[k].left;
      return LevelGen.countSolutions(G.blocked, G.rows, G.cols, counts, cap||200, 3000000, G.wallsActive);
    },
    state: function(){
      return { level:G.index+1, picture:G.level.picture.id,
               cells:G.level.playable, mosaic:G.level.mosaicCount,
               pieces:G.level.pieceCount, deck:G.deck.length,
               filled:G.filled, undo:G.history.length, solved:G.solved };
    }
  };

  window.Game = { boot:boot, loadLevel:loadLevel, undo:undo, restart:restart, hint:hint };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

<script>
(function(){
  var row = document.getElementById('fxrow'), desc = document.getElementById('fxdesc');
  function paint(){
    var cur = FX.current();
    [].forEach.call(row.children, function(b){
      b.setAttribute('aria-pressed', String(b.dataset.id === cur.id));
    });
    desc.innerHTML = '<b>' + cur.id + ' · ' + cur.name + '</b> — ' + cur.desc;
  }
  FX.presets().forEach(function(p){
    var b = document.createElement('button');
    b.type = 'button'; b.dataset.id = p.id; b.textContent = p.id + ' · ' + p.name;
    b.onclick = function(){ FX.use(p.id); paint(); };
    row.appendChild(b);
  });
  paint();
})();
</script>
